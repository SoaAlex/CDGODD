name: Deploy

# main -> production deploy (custom domains).
# any other branch -> preview version upload: same Workers, no traffic change,
# preview URL on *-<worker>.cestdegaucheoudedroite.workers.dev.
# Previews share PROD bindings (D1/R2) — no migrations run outside main.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # --- API ---
      - name: Apply D1 migrations
        if: env.IS_MAIN == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply cdgodd --remote

      - name: Deploy API worker
        if: env.IS_MAIN == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      - name: Upload API preview version
        if: env.IS_MAIN != 'true'
        working-directory: apps/api
        run: pnpm exec wrangler versions upload

      # --- Admin ---
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: https://api.cestdegaucheoudedroite.com

      - name: Deploy admin
        if: env.IS_MAIN == 'true'
        working-directory: apps/admin
        run: pnpm exec wrangler deploy

      - name: Upload admin preview version
        if: env.IS_MAIN != 'true'
        working-directory: apps/admin
        run: pnpm exec wrangler versions upload

      # --- Game web ---
      - name: Build game web
        working-directory: apps/game
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.cestdegaucheoudedroite.com
          EXPO_PUBLIC_TURNSTILE_SITEKEY: 0x4AAAAAADxcifQdjBeiuVUB

      - name: Deploy game
        if: env.IS_MAIN == 'true'
        working-directory: apps/game
        run: pnpm exec wrangler deploy

      - name: Upload game preview version
        if: env.IS_MAIN != 'true'
        working-directory: apps/game
        run: pnpm exec wrangler versions upload
