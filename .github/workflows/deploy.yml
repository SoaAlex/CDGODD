name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # --- API (api.cestdegaucheoudedroite.fr) ---
      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply cdgodd --remote

      - name: Deploy API worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      # --- Admin (admin.cestdegaucheoudedroite.fr) ---
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: https://api.cestdegaucheoudedroite.fr

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy

      # --- Game web (cestdegaucheoudedroite.fr) ---
      - name: Build game web
        working-directory: apps/game
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.cestdegaucheoudedroite.fr

      - name: Deploy game
        working-directory: apps/game
        run: pnpm exec wrangler deploy
