name: Deploy

# main -> production (cestdegaucheoudedroite.com)
# any other branch -> dev (dev.cestdegaucheoudedroite.com), isolated D1/R2
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # Select target: main -> prod, everything else -> dev ([env.dev] in
      # each wrangler.toml; separate D1/R2, *.dev.cestdegaucheoudedroite.com).
      - name: Select environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "wrangler_env_flag=" >> "$GITHUB_OUTPUT"
            echo "d1_name=cdgodd" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.cestdegaucheoudedroite.com" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_env_flag=--env dev" >> "$GITHUB_OUTPUT"
            echo "d1_name=cdgodd-dev" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.dev.cestdegaucheoudedroite.com" >> "$GITHUB_OUTPUT"
          fi

      # --- API ---
      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply ${{ steps.target.outputs.d1_name }} --remote ${{ steps.target.outputs.wrangler_env_flag }}

      - name: Deploy API worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy ${{ steps.target.outputs.wrangler_env_flag }}

      # --- Admin ---
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: ${{ steps.target.outputs.api_url }}

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy ${{ steps.target.outputs.wrangler_env_flag }}

      # --- Game web ---
      - name: Build game web
        working-directory: apps/game
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.target.outputs.api_url }}
          EXPO_PUBLIC_TURNSTILE_SITEKEY: 0x4AAAAAADxcifQdjBeiuVUB

      - name: Deploy game
        working-directory: apps/game
        run: pnpm exec wrangler deploy ${{ steps.target.outputs.wrangler_env_flag }}
