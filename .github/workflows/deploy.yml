name: Deploy

# Behavior comes from GitHub environments (repo Settings > Environments):
#   production (main only, branch-protected):
#     WRANGLER_COMMAND=deploy, RUN_MIGRATIONS=true, DEPLOY_URL=prod site
#   dev (every other branch):
#     WRANGLER_COMMAND=versions upload, RUN_MIGRATIONS=false
# Branch pushes upload preview versions of the prod Workers: no traffic
# change, preview URL on *-<worker>.cestdegaucheoudedroite.workers.dev.
# Previews share PROD bindings (D1/R2) — migrations never run outside main.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # --- API ---
      - name: Apply D1 migrations
        if: vars.RUN_MIGRATIONS == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply cdgodd --remote

      - name: Deploy API worker
        working-directory: apps/api
        run: pnpm exec wrangler ${{ vars.WRANGLER_COMMAND }}

      # --- Admin ---
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: https://api.cestdegaucheoudedroite.com

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler ${{ vars.WRANGLER_COMMAND }}

      # --- Game web ---
      - name: Build game web
        working-directory: apps/game
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.cestdegaucheoudedroite.com
          EXPO_PUBLIC_TURNSTILE_SITEKEY: 0x4AAAAAADxcifQdjBeiuVUB
          # AdSense ids are public by design (visible in page source).
          EXPO_PUBLIC_ADSENSE_CLIENT: ca-pub-5889686672909524
          EXPO_PUBLIC_ADSENSE_SLOT_BANNER: '3436416771'
          EXPO_PUBLIC_ADSENSE_SLOT_SIDE: '3972814844'

      - name: Deploy game
        working-directory: apps/game
        run: pnpm exec wrangler ${{ vars.WRANGLER_COMMAND }}
