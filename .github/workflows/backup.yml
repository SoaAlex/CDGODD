name: Backup D1

# Daily SQL dump of the prod D1 database (cdgodd) into the private R2 bucket
# `cdgodd-backups`. Objects auto-expire after 90 days via a bucket lifecycle
# rule (one-time setup: `wrangler r2 bucket lifecycle add cdgodd-backups
# expire-old-backups "" --expire-days 90`). Complements D1 Time Travel
# (30-day point-in-time recovery) — this survives accidental database
# deletion, Time Travel does not.
#
# Restore: download the dump, then
#   gunzip cdgodd-<ts>.sql.gz
#   wrangler d1 execute cdgodd --remote --file cdgodd-<ts>.sql
on:
  schedule:
    - cron: '30 3 * * *' # daily, before the 04:00 UTC GDPR sweep
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export D1 database
        working-directory: apps/api
        run: pnpm exec wrangler d1 export cdgodd --remote --output /tmp/backup.sql

      - name: Sanity-check and compress dump
        run: |
          # An empty/truncated dump means the export silently failed —
          # better to alert than to upload garbage.
          grep -q 'CREATE TABLE' /tmp/backup.sql
          gzip -9 /tmp/backup.sql

      - name: Upload to R2
        working-directory: apps/api
        run: |
          pnpm exec wrangler r2 object put \
            "cdgodd-backups/cdgodd-$(date -u +%Y-%m-%dT%H-%M-%S).sql.gz" \
            --file /tmp/backup.sql.gz --remote
