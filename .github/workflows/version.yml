name: Version

# Auto semantic versioning for the whole project.
#
# After a successful Deploy on main, compute the next semver from the
# Conventional Commits since the last tag, push the git tag, and cut a GitHub
# Release with generated notes.
#
# Tag-only: no package.json bump commit, so there is no bot commit loop and no
# extra CI run. Gated on a green Deploy (typecheck + test + deploy all passed),
# so a broken build never gets a version. default_bump=patch means every push
# to main yields at least a patch bump, even without a feat:/fix: commit.
on:
  workflow_run:
    workflows: ['Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    # Skip if the Deploy run failed. workflow_dispatch has no source run, so
    # allow it through for manual re-tagging.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute + push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
