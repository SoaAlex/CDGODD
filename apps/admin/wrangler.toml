name = "cdgodd-admin-v2"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "admin.cestdegaucheoudedroite.com", custom_domain = true },
]

# Assets-only Worker: serves the Vite build, no server code.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Dev environment (deploy: `wrangler deploy --env dev`, worker `cdgodd-admin-v2-dev`).
[env.dev]
routes = [
  { pattern = "admin.dev.cestdegaucheoudedroite.com", custom_domain = true },
]

[env.dev.assets]
directory = "./dist"
not_found_handling = "single-page-application"
