name = "cdgodd-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "api.cestdegaucheoudedroite.com", custom_domain = true },
]

# Preview URLs for non-prod branches: CI runs `wrangler versions upload`,
# version gets *-cdgodd-api.cestdegaucheoudedroite.workers.dev. Previews use
# PROD bindings (D1/R2) — schema-changing branches will 500 until merged.
preview_urls = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cdgodd"
database_id = "70625d39-d78a-4dcc-8507-d9ad6660269a"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cdgodd-images"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Public base URL for card images: the R2 bucket's custom domain (direct,
# Cloudflare-cached). Local dev overrides this in .dev.vars to hit the
# Worker's /img/* route instead.
CDN_BASE = "https://images.cestdegaucheoudedroite.com"
# Set real secrets with `wrangler secret put`:
#   TURNSTILE_SECRET  - Cloudflare Turnstile secret key
#   IP_HASH_SALT      - random salt for ip_hash (rotate periodically)
#   ADMIN_TOKEN       - bearer token for /admin routes (v1 auth)

# Test-only environment used by vitest (@cloudflare/vitest-pool-workers).
# Same bindings as prod EXCEPT the AI binding: AI is remote-only, and its
# mere presence makes the test pool open a remote proxy session (needs
# Cloudflare credentials, bills usage). Tests mock env.AI instead.
[env.test]

[[env.test.d1_databases]]
binding = "DB"
database_name = "cdgodd"
database_id = "70625d39-d78a-4dcc-8507-d9ad6660269a"

[[env.test.r2_buckets]]
binding = "IMAGES"
bucket_name = "cdgodd-images"

[[env.test.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[env.test.vars]
CDN_BASE = "https://cdn.test"
