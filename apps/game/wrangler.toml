name = "cdgodd-game"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "cestdegaucheoudedroite.com", custom_domain = true },
]

# Assets-only Worker: serves the Expo web export (expo export -p web).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Dev environment (deploy: `wrangler deploy --env dev`, worker `cdgodd-game-dev`).
[env.dev]
routes = [
  { pattern = "dev.cestdegaucheoudedroite.com", custom_domain = true },
]

[env.dev.assets]
directory = "./dist"
not_found_handling = "single-page-application"
